message: "Сюрвей осадки (https://eurogal-surveys.ru/) — это способ расчёта осадки судна для установления массы находящегося на борту груза. \r\nДанный метод базируется на физический закон вытеснения и позволяет расчёта количества продукции по изменению водоизмещения. \r\nОперация выполняется перед и после загрузки или разгрузки, чтобы зафиксировать фактическое вес перемещённого груза. \r\nСам процесс включает снятия показаний углубления в нескольких местах и внесения поправок на удельный вес жидкости. \r\nДрафт сюрвей широко применяется в судоходстве для коммерческих расчётов и инспекций. \r\nЭто считается достоверным инструментом контроля массы товаров, признанным международными конвенциями."
