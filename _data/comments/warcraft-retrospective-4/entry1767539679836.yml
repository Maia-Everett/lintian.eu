message: "Деятельность в области недропользования — это совокупность процессов, связанный с освоением природных ресурсов. \r\nОно включает добычу минерального сырья и их промышленное освоение. \r\nНедропользование регулируется законодательством, направленными на охрану окружающей среды. \r\nОтветственное ведение работ в недропользовании обеспечивает устойчивое развитие. \r\n<a href=\"https://oern.expert/?oern-obschestvo-ekspertov-rossii-po-nedropolzovaniyu-9.html\">оэрн официальный сайт</a>"
name: общество экспертов России по недропользованию
