message: "Деятельность в области недропользования — это совокупность процессов, связанный с разработкой подземных богатств. \r\nОно включает поиск минерального сырья и их рациональное использование. \r\nНедропользование регулируется установленными правилами, направленными на безопасность работ. \r\nОтветственное ведение работ в недропользовании помогает сохранять ресурсы. \r\n<a href=\"https://oern.expert/\">оэрн</a>"
name: общество экспертов России по недропользованию
