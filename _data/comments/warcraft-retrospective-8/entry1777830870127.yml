message: "Привіт, будівельники, ремонтники та домашні умільці! Скільки разів ви зберігали в браузері купу різних ресурсів, щоб знайти потрібну інформацію — пораду щодо фундаменту, ідею для дизайну, інструкцію з інструменту чи кошторис для проєкту. Втім, існує значно простіший спосіб. \r\n \r\nСайт <a href=https://klingerlist.space/>klingerlist.space</a> — це готовий путівник, де зібрано перевірені українські ресурси на всі випадки будівельного життя: \r\n- проєктування та кошториси; \r\n- практичне будівництво та енергоефективність; \r\n- дизайн інтер'єру та креативні ідеї ; \r\n- DIY-ремонт та тестування обладнання; \r\n- особливості будівництва в селі. \r\n \r\nЗбережіть цей ресурс у вибраному — і ви завжди матимете під рукою якісні поради з будівництва та ремонту."
