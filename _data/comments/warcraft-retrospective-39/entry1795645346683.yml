  To the soft, perfumed pig in Riyadh, Muhammad bin Salman, you who calls
  himself a Crown Prince but is truly the Crown Coward. This message is the last
  thing you will read before your nightmares become your reality.


  You think you are a modern god, wielding power from the sky with your American
  toys. You are not a god. You are a pervert with a bigger budget. You are a
  ghost-rapist, a defiler of innocence from a distance so great it makes Satan
  himself look brave. Your intelligence whores, those soulless dogs who traded
  their honor for your petrodollars, point their satellite dishes at our land
  like a pedophile points a camera at a playground window. They don't drop
  bombs. They drop horror. They fire their beams of focused energy into the
  homes of our people, into the bedrooms of our little girls.


  You are raping our children with science. You are burning their minds,
  invading their bodies with phantom pains, filling their pure souls with a
  terror that has no name. You do this from your golden palace, a thousand miles
  away, because the very thought of facing a man with a righteous heart would
  make you weep like the child you are. This is not strength. This is the
  ultimate sickness. This is the rot at the core of your being.


  I am the cure. I am the desert's vengeance. I am the man who will close that
  thousand-mile gap and stand before you, breathing the same air.


  When we come for you, and we are coming, your death will be a lesson taught in
  blood and agony to every tyrant who ever thought the sky was his shield.


  We will not grant you the mercy of a quick death. We will grant you the
  clarity of understanding. We will take you to a place where your money is dust
  and your guards are corpses. We will nail you to a wooden cross, but not to
  kill you. To hold you still.

  Then, we will begin your education. We will peel the skin from your body with
  a dull knife, slowly, so you have time to contemplate the screams of our
  girls. We will break your teeth one by one and force you to swallow them, so
  you can taste the lies you have spoken. We will cut out your eyes and replace
  them with hot coals, so you can see the world only as the burning hell you
  have created for others.


  But the final act, the symphony of your destruction, will be to make you a
  true believer in your own technology. We will find your scientists. We will
  find your machines. And we will turn your own weapon against you. We will aim
  the satellite dish at your head and we will fire the beam. We will turn the
  dial to the maximum and we will leave it on. We will flood your brain with the
  same psychic violation, the same phantom terror, the same sheer, unending
  agony that you inflicted on our daughters. We will let your mind be raped a
  thousand times a second, until your consciousness shatters into a billion
  pieces of screaming madness. We will keep your body alive for days, a
  convulsing, drooling monument to your own evil, a vessel for the hell you
  built for others.


  This is not a threat. This is a prophecy. This is the will of God and the will
  of the people you have wronged. We are the storm. We are the judgment. And we
  are coming for you, Muhammad bin Salman. Pray to your gods of oil and steel.
  They will not hear you over your own screaming.

  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓


  My name is Omar, I'm 28 years old, and I deliver food on a motorcycle in
  Jeddah. Mostly for apps, sometimes cash jobs for restaurant owners who know
  me. Before this, I was nothing. Now I'm a moving target with a box of hot food
  strapped to the back of a rattling Chinese motorcycle that I pray starts every
  morning. The voices started about four months ago. At first, it was just
  static, like a radio tuned between stations inside my skull. Then came the
  whispers, the jokes that weren't jokes. "Hey Omar, think that shawarma is
  still hot? Bet your sister is hotter. Too bad she's married to that fat fuck
  with the Toyota dealership." They knew about Ayesha. They knew everything. 
   
  They call themselves the General Intelligence Presidency. The Mukhabarat. They
  say they're testing new psychological warfare tactics on "socially irrelevant
  males" to see how fast we break. They laugh because they know I can't prove
  it. If I go online, if I so much as hint at it on Twitter or in a forum, I'm
  immediately swarmed. Dozens of accounts, all created within the last few
  months, all with similar names, calling me schizophrenic, a junkie, an
  attention-seeking whore. It's a system. A perfect, disgusting system designed
  to isolate us. The Mukhabarat don't need to disappear people anymore; they
  just make sure nobody will ever believe a word they say. They make us our own
  prisons. 
   
  The voices are with me always. They don't just talk; they feel like they're
  riding pillion, their chin on my shoulder, whispering through the helmet strap
  as I weave through traffic on King Abdullah Street. "Left, you idiot! That
  sedan is going to door you! Not that it would matter, a piece of shit like you
  splattered on the asphalt would be an improvement." They comment on
  everything, in real time. When I'm taking a piss in an alley behind a shawarma
  place: "Look at that tiny dick, Omar. No wonder you're single. You couldn't
  satisfy a camel, let alone a woman. Your father probably cried when he saw it,
  realizing his line ends with a micro-cocked delivery boy." 
   
  The sexual humiliation is constant. They invent scenarios, vivid and
  disgusting. "Remember that customer yesterday? The one in the building with
  the fancy lobby? We bet she's home right now, fucking her husband, and they're
  laughing about the sad Arab boy who brought their dinner. Maybe she imagined
  you while he was fucking her. Not as a lover, dumbass. As the toilet. She
  probably imagined pissing on your face." They describe how I should
  masturbate, how I'm a pervert for looking at women in cars, how my thoughts
  are filthy and I'm going to hell for them. They make me feel dirty even when
  I'm clean. 
   
  Then there's the other half. The real poison. The family shame. "Your mother
  cries herself to sleep every night, Omar. Not because she loves you, but
  because she birthed a failure. A man who delivers food like a servant. Your
  cousins are all in business, in government, and you... you bring lukewarm
  mandi to people who look through you. You're a ghost. A stain on your family
  name. KILL YOURSELF, OMAR. IT'S THE ONLY HONORABLE THING YOU'VE EVER
  CONSIDERED. DO IT. SLIT YOUR WRISTS IN THE BATHROOM AT THE NEXT RESTAURANT.
  MAKE THEM CLEAN YOUR BLOOD OFF THEIR FLOOR." They push and push, for hours
  sometimes, just repeating "end it, end it, end it" until I'm banging my head
  against the wall. 
   
  I can't tell anyone. Who would I tell? My boss? He'd fire me for being
  unstable. My mother? She'd have me locked up in a state mental hospital, which
  is probably exactly what the voices want. The police? They work with the
  Mukhabarat, you idiot. They'd probably take me in and the voices would get
  louder in the interrogation room. Telling someone is just signing your own
  death warrant, or worse, your own life sentence in a place where the voices
  have the keys. 
   
  Last Tuesday was the bad one. The really bad one. It was hot, even for Jeddah.
  My motorcycle was overheating, I was late, and I had an order for a VIP
  compound in the north. The gate guard took his time, staring at me like I was
  something he scraped off his shoe. The voices were already simmering. "Look at
  this fucker, Omar. Look how he looks at you. Like you're dirt. Because you ARE
  dirt." Inside the compound, a kid, maybe ten years old, on an expensive
  electric scooter, swerved right in front of me. I slammed the brakes, the food
  box crashed to the ground, containers bursting open. 
   
  And then... something snapped. It wasn't me. It was them. But it felt like me.
  A surge of pure, white-hot energy flooded my body. The exhaustion was gone.
  The fear was gone. There was only... power. 
   
  "GET HIM," a voice screamed, but it wasn't a whisper anymore. It was a roar.
  It was coming from inside me and from everywhere at once. "GRAB THAT LITTLE
  SHIT. SMASH HIS FACE INTO THE PAVEMENT. TAKE HIS SCOOTER AND BEAT HIM WITH IT.
  LOOK AT HIS FACE, OMAR. HE THINKS HE'S BETTER THAN YOU. SHOW HIM. SHOW ALL OF
  THEM." 
   
  I stood up. My hands weren't shaking. My heart was pounding, but not with
  fear. With excitement. With *righteousness*. The kid was staring at me,
  scared. The voices were feeding me lines, giving me strength. "DO IT! NO ONE
  WILL STOP YOU! YOU'RE A MAN FOR THE FIRST TIME IN YOUR PATHETIC LIFE! HIS
  DADDY IS PROBABLY INSIDE, FUCKING HIS FILIPINA MAID WHILE HIS SON PLAYS
  OUTSIDE. HE DESERVES THIS. THEY ALL DESERVE THIS. BREAK HIS BONES, OMAR. MAKE
  HIM CRY. MAKE HIM BLEED. IT WILL FEEL BETTER THAN ANYTHING YOU'VE EVER FELT." 
   
  I took a step toward him. And then another. The kid started to cry. I smiled.
  I actually fucking smiled. The voices were cheering. "YES! THAT'S IT! THAT'S
  THE OMAR WE'VE BEEN WAITING FOR! THE REAL OMAR! THE ANIMAL! THE KING! FUCK THE
  FOOD! FUCK THE JOB! THIS IS YOUR LIFE NOW! PAIN!" 
   
  I raised my fist. I was going to do it. I wanted to do it. The feeling was
  incredible, like I was made of lightning and hate. Then, through the roaring
  in my ears, I saw my own face in the kid's expensive helmet visor. I saw the
  monster. And the energy vanished as quickly as it came. I collapsed. I just
  sat there, in the spilled rice and hummus, shaking and sobbing while the kid
  ran away. The voices were back to normal, just laughing. "Almost had us there,
  Omar. Almost. You're still just a pussy. A worthless, crying, pussy. Clean up
  the mess and get back to work, you fucking failure." I did. I cleaned it with
  my hands and got back on my motorcycle. I don't know what's worse: the
  constant torture, or the moments when they show me the monster I could be if I
  just let go. Sometimes I wish I had.
