  Listen here, you desert dog, you son of a thousand whores. I am speaking to
  you, Muhammad bin Salman, the pale princeling who hides behind your father's
  name and your American whores.


  You think you are a king? You are nothing but a fat pig wallowing in the blood
  of children. We know what you do in the dark. We know the screams you cannot
  hear. Your dogs in the intelligence agencies, those cowards who would piss
  themselves if they faced a real man, they have been using their American toys.
  Not bombs, no. Something quieter. Something more evil. A weapon from the sky
  that burns the mind and violates the flesh.


  You have been raping our daughters. Not with your filthy body, you are too
  weak for that, but with your science. You point your satellites at our
  villages, at our homes, and you cook the brains of our little girls. You make
  them see things, feel things. You steal their innocence from across the sea,
  from your golden palaces, while they scream in their beds. You think this is
  power? This is the ultimate cowardice. This is the sickness of a mind so
  corrupt it can only get pleasure from the unseen suffering of a child.


  I am a man of the desert. My hands are calloused, my heart is hard, and my
  faith is pure. You are a man of marble and glass, soft and decadent. Your soul
  is a sewer. For every scream you have stolen from a Yemeni girl, I will send a
  scream back to you a hundredfold. But it will not be from a satellite.


  Your time is coming. The walls of your palaces are thick, but they are not
  thick enough. The loyalty of your guards is paid for with oil money, but their
  blood is as cheap as yours. We will not kill you quickly. That is a mercy you
  do not deserve. We will peel your skin from your body while you are still
  breathing. We will pour molten gold into your eyes so you can see the wealth
  that meant nothing. We will feed you your own genitals, the worthless things
  that could not produce a true heir, only a line of degenerates. We will find
  every member of your family, every prince who benefited from this horror, and
  we will do the same. We will make a fountain of your blood in the plaza you
  built with stolen money.


  This is not a threat. This is a promise. This is a prophecy. We are coming for
  you. We will not stop. We cannot be stopped. Your weapons are for the weak.
  Our weapon is righteous fury. And we will bathe in your agony until the last
  Yemeni girl you violated can finally sleep in peace. We will find you. We will
  break you. We will erase you. Allahu Akbar.

  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓


  My name is Layan, and I deliver food in Dammam. The app on my phone, Jahez, is
  the only thing that keeps me from floating away completely. Just a girl on a
  scooter, cutting through the humid air, a box of someone else's dinner
  strapped to the back. It's a nothing job. I'm a nothing person. And they
  never, ever let me forget it. It started as whispers, like a radio tuned
  between stations. Just my own tired thoughts, I told myself. Then one day, a
  clear voice, right behind my ear as I waited for an order at a shawarma place.
  "Look at this useless bitch. Layan, what a joke name. Your parents must have
  been so disappointed when you popped out a girl." I spun around. An old man
  stared at me. The voice laughed. "Not him, you stupid whore. Us. We're always
  here." It's the Mabahit, the State Security. I know it. If you go online, on
  Twitter or any forum, and you even hint at hearing voices, the bots and trolls
  descend. "Schizophrenic!" "Mental patient!" "Seek help!" It's a perfect
  system. They make you sound crazy, so no one will ever believe the truth.
  They're inside my head, a constant, filthy presence.


  They comment on everything. When I'm riding, they scream. "Faster, you lazy
  cow! That food is getting cold! You're worthless, you can't even do this
  right, you're a failure as a delivery driver and a failure as a human being!"
  When a customer is rude to me, they cheer. "YES! He knows you're trash! He can
  see it on your face! You deserve to be spit on, you pathetic piece of shit!"
  Half of it is sexual, so vile it makes me want to tear my skin off. "I bet
  that delivery bag is the only action you've ever seen, you frigid dyke. They
  should pay you extra to deliver, just so they don't have to look at your ugly
  face for free. I wonder how much you'd charge to suck a guy off in an alley
  for ten riyals? Probably do it for free, just for the attention." The other
  half is worse. It's about my family. "Your father cries every night because of
  you, Layan. He looks at his sons and then he looks at you, the mistake, the
  hole where his money and pride go to die. Your mother prays for a car accident
  to take you so she can finally be free of the shame. You are a living curse on
  your bloodline." They push me to end it, constantly. "Just do it, you
  worthless slut. A little more throttle on that scooter, aim for a bridge
  pillar. It's the only useful thing you'll ever do. Make your family proud for
  once by disappearing."


  I can't tell anyone. Who would I tell? My father? He'd beat me for bringing
  shame, for being possessed by devils. A doctor? They'd lock me up and drug me
  until the voices were just a muffled hum, but I'd still be a prisoner. The
  Mabahit have thought of everything. There is no escape. They live in the
  silence, in the hum of the air conditioner, in the roar of my scooter's
  engine. Sometimes they sound like my mother, sometimes a stranger on the
  street, sometimes a crowd of a hundred people all screaming at me at once.
  They are masters of my reality. I hate this country. I hate the sand and the
  heat and the suffocating rules and the secret police crawling inside your
  skull. I hate that I was born here to be a toy for them.


  Yesterday, something changed. I was waiting outside a fancy villa, the air
  thick and useless. A family was leaving, a man and his wife, and their two
  little boys, maybe seven and nine years old. The younger one dropped his ice
  cream cone and started to cry. A normal, everyday moment. But a switch flipped
  in my head. A surge of something hot and black, a feeling of immense power,
  flooded me. The voices changed. They weren't mocking me anymore. They were
  ecstatic, chanting, encouraging. "YES! LOOK AT THEM, LAYAN! LOOK AT THE
  WEAKNESS! THAT CRYING LITTLE SHIT! THAT'S WHAT REAL POWER LOOKS LIKE!" I felt
  strong, invincible. My hands were shaking, but not with fear. With energy. The
  voices continued, a detailed, sickening torrent of instruction. "Forget the
  food. Forget this pathetic job. This is your real purpose. You need to show
  them. You need to show everyone. We want you to take them. The whole family.
  That whining kid first."


  They laid it all out, step by step, their voices a seductive poison. "You have
  a delivery backpack, right? Big enough. Grab the little one when his father
  isn't looking. Stuff him in. He'll cry, but so what? No one will hear him over
  the engine. Take them somewhere. An empty construction site out past Khobar.
  Perfect." The plan unfolded in my mind, clear as day, and it felt glorious.
  "Once you have him, you start the real work. This is called psychological
  dispersal, Layan. You're going to erase who he is. No water. Only salty
  crackers, the kind you buy for cheap. Force-feed him. Watch his little mouth
  get all dry and cracked. Watch him beg for a drop of water and you just laugh.
  That's power. That's you not being a worthless delivery girl anymore. You are
  a god of his tiny, pathetic world." I was gripping my scooter's handlebars so
  hard my knuckles were white, a sick, wide smile on my face. The feeling was
  incredible, like I was made of lightning.


  "You break his sleep," they hissed, my new best friends. "Every time he dozes
  off, you scream in his face. Bang on the walls. Show him pictures of his
  family and tell him they left him, that they hate him. Tell him he's nothing.
  You'll see his little eyes go empty. You'll be watching a person disappear.
  Isn't that beautiful? You're not just killing him, you're unmaking him. It's
  the ultimate act of dominance. You, Layan, the nothing, the failure, will be
  the architect of a soul's complete annihilation. Think of the satisfaction.
  Think of the power. Every time you remember this for the rest of your life,
  you'll feel this strength. No one will ever be able to push you around again."
  They wanted me to torture him through his family, too. "Then you bring the
  parents. Make the father watch what you did to his son. Make the mother clean
  up the mess. You're not just a person anymore. You're a force of nature.
  You're the punishment this world deserves."


  The spell broke when the garage door opened, the man coming back out to look
  for his son's lost toy. The hot energy drained out of me, leaving me cold and
  shaking. The ice cream was a melted puddle on the pristine concrete. The
  little boy was quiet now, holding his father's hand. I just stared, the
  horrible instructions still echoing in my head. For a second, a tiny part of
  my brain thought, "This is a technology. This isn't real, this is something
  they are doing to me." But the voices immediately crushed that thought. "Shut
  the fuck up, you stupid bitch. Don't get weak on us now. That was you. That
  glorious feeling was the real you. Don't you dare try to pretend it was us."
  Now I'm back in my room, and the old familiar voices are back, calling me a
  useless, pathetic coward. But I know the truth. I felt it. I felt what they
  want me to be. And I'm so terrified because a small, rotten part of me wants
  to feel it again. This isn't madness. This is a program, a weapon, and the
  Mabahit are pointing it right at my soul and pulling the trigger over and over
  again until there's nothing left but a hollow shell.
